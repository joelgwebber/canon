[workspace]
resolver = "2"
members = [
    "crates/canon-core",
    "crates/canon-daemon",
    "crates/canon-tidal",
    "crates/canon-audio",
    "crates/canon-sink",
    "crates/canon-library",
    "crates/canon-api",
]

# Shared package metadata. Each crate opts in with `<field>.workspace = true`.
[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Joel Webber"]
repository = "https://github.com/jgw/canon"

# Single source of truth for dependency versions across the workspace.
[workspace.dependencies]
# --- canon crates (path deps) ---
canon-core = { path = "crates/canon-core" }
canon-tidal = { path = "crates/canon-tidal" }
canon-api = { path = "crates/canon-api" }
canon-audio = { path = "crates/canon-audio" }
canon-sink = { path = "crates/canon-sink" }
canon-library = { path = "crates/canon-library" }

# --- shared third-party ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
async-trait = "0.1"
base64 = "0.22"
quick-xml = "0.37"
# PKCE: SHA-256 code challenge + random verifier bytes (canon-d389).
sha2 = "0.10"
getrandom = "0.2"
# Local audio output (canon-940d) + the realtime ring (canon-8629).
cpal = "0.15"
rtrb = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The library store (canon-78ea): bundled sqlite, so no system library is assumed.
rusqlite = { version = "0.37", features = ["bundled"] }

# --- control plane (ws+json) + daemon CLI ---
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
# ws client for the control-plane integration test and the `canon control` TUI.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
futures-util = "0.3"
# Keypress TUI for `canon control` (interactive stress-test client).
crossterm = { version = "0.28", features = ["event-stream"] }

[profile.release]
# Audio work wants the optimizer on; thin-LTO is a good default for a daemon.
lto = "thin"
