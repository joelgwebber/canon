[package]
name = "canon-sink"
version = "0.1.0"
description = "Network Sink implementations (Chromecast, DLNA) plus resilient device discovery and the LAN stream server."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
canon-core.workspace = true
async-trait.workspace = true
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
bytes = "1.12.1"
tokio-stream = "0.1.19"
mdns-sd = "0.21.4"
socket2 = "0.6.5"
if-addrs = "0.15.0"
rust_cast = { version = "0.21.0", default-features = false, features = ["cast", "thread_safe"] }
flacenc = { version = "0.5.1", default-features = false }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
