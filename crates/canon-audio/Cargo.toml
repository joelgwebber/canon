[package]
name = "canon-audio"
version = "0.1.0"
description = "Audio pipeline: decode (Symphonia), ring buffer, realtime-safe callback, DSP, cpal local sink."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
canon-core.workspace = true

# Decode/demux. Pinned lean: only the container (isomp4) and the two codecs Tidal
# ships (flac, aac). `default-features = false` drops the codecs/formats we don't
# use (ogg, mkv, wav, vorbis, mp3, metadata) so the spike measures exactly the
# isomp4 + flac/aac path and nothing else. isomp4 is the fragmented-MP4 risk under
# test (yak canon-c4c3).
symphonia = { version = "0.6.1", default-features = false, features = ["isomp4", "flac", "aac"] }

# Local output (canon-940d) + the realtime SPSC ring between decode and the callback
# (canon-8629). cpal is the cross-platform device layer; rtrb is a lock-free SPSC ring.
cpal = { workspace = true }
rtrb = { workspace = true }
# Only the sync channel type used to report engine events back to the player.
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
