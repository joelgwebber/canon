[package]
name = "canon-api"
version = "0.1.0"
description = "Remote surface: the WebSocket+JSON control plane and the MCP tool layer over the core."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
canon-core.workspace = true
canon-library.workspace = true
canon-protocol.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["net"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# Player tokens and signed stream URLs (canon-65d2): SHA-256 for token hashes and HMAC, random
# tokens and keys, URL-safe encoding.
sha2.workspace = true
getrandom.workspace = true
base64.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
async-trait.workspace = true
