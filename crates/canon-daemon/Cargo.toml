[package]
name = "canon-daemon"
version = "0.1.0"
description = "The headless canon daemon binary."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "canon"
path = "src/main.rs"

[dependencies]
canon-core.workspace = true
canon-library.workspace = true
canon-tidal.workspace = true
canon-spotify.workspace = true
canon-api.workspace = true
canon-audio.workspace = true
canon-sink.workspace = true
# io-std/io-util: `canon control` reads commands a line at a time from stdin.
tokio = { workspace = true, features = ["net", "io-std", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
directories.workspace = true
async-trait.workspace = true
# `canon control` interactive client.
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde_json.workspace = true
