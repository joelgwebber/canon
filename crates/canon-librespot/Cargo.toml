[package]
name = "canon-librespot"
version = "0.1.0"
description = "Spotify audio through librespot (Premium): a canon Source. A spike (yak canon-52fb)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# rustls, not librespot's default native-tls: on Linux that links OpenSSL, and
# wreq's BoringSSL shadows it at link time (canon-4e4b).
canon-core.workspace = true
librespot-core = { version = "0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-audio = { version = "0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-metadata = { version = "0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-oauth = { version = "0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
async-trait.workspace = true
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
getrandom.workspace = true
